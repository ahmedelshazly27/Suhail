<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Newsreader:opsz,wght@6..72,300;6..72,400&amp;display=swap">
<style>
body{margin:0}
a{color:#171513}a:hover{color:#E8461C}
</style>
</helmet>
<nav aria-label="Dashboard" style="box-sizing: border-box; min-height: 980px; height: 100%; background: #EFECE6; border-inline-end: 1px solid #E4E0D8; padding: 18px 12px 16px; display: flex; flex-direction: column; gap: 18px; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #171513;">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; color: #171513;">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="M10 0 L11.6 8.4 L20 10 L11.6 11.6 L10 20 L8.4 11.6 L0 10 L8.4 8.4 Z"></path></svg>
      <span style="font-weight: 500; font-size: 15px;">Suhail</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .12em; color: #6B645B; text-transform: uppercase;">Team</span>
    </a>
    <a href="Palette.dc.html" aria-label="Search" style="display: flex; align-items: center; gap: 4px; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B645B; border: 1px solid #E4E0D8; background: #F7F6F2; padding: 4px 6px;">⌘K</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 1px;">
    <sc-for list="{{ top }}" as="item" hint-placeholder-count="3">
      <a href="{{ item.href }}" style="{{ item.style }}">
        <span>{{ item.label }}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B645B;">{{ item.count }}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 1px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6B645B; padding: 0 8px 6px;">Workspace</span>
    <sc-for list="{{ work }}" as="item" hint-placeholder-count="7">
      <a href="{{ item.href }}" style="{{ item.style }}">
        <span>{{ item.label }}</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B645B;">{{ item.count }}</span>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 1px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6B645B; padding: 0 8px 6px;">Projects</span>
    <sc-for list="{{ projects }}" as="p" hint-placeholder-count="4">
      <a href="Board.dc.html" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 13.5px; text-decoration: none; color: #3A3530;">
        <span style="{{ p.dot }}"></span>
        <span>{{ p.name }}</span>
      </a>
    </sc-for>
  </div>

  <div aria-hidden="true" style="margin-top: auto; height: 72px; margin-inline: -12px; opacity: .45; background-image: radial-gradient(circle, #E8461C 0 1px, transparent 1.25px), radial-gradient(circle, #E8461C 0 .6px, transparent .85px); background-size: 6px 6px, 6px 6px; background-position: 0 0, 3.0px 3.0px; -webkit-mask-image: linear-gradient(0deg, #000 0%, transparent 100%); mask-image: linear-gradient(0deg, #000 0%, transparent 100%);"></div>
  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid #E4E0D8; background: #F7F6F2; font-size: 12px; color: #3A3530;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h10v10H4z"></path><path d="M14 10l6-3v10l-6-3"></path></svg>
      <span>Microsoft 365 connected</span>
      <span style="margin-inline-start: auto; width: 6px; height: 6px; border-radius: 50%; background: #171513;"></span>
    </div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px; text-decoration: none; color: #171513;">
      <span style="position: relative; width: 28px; height: 28px; border-radius: 50%; background: #171513; color: #F7F6F2; display: grid; place-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 11px;">AE<span style="position: absolute; inset-inline-end: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: #171513; border: 2px solid #EFECE6;"></span></span>
      <span style="display: flex; flex-direction: column; line-height: 1.2;"><span style="font-size: 13px; font-weight: 500;">Ahmed</span><span style="font-size: 11.5px; color: #6B645B;">Owner · Available</span></span>
      <span style="margin-inline-start: auto; font-size: 12px; color: #6B645B;">Settings</span>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","inbox","projects","sprints","applications","relationships","content","newsletter","drive","finance"],"default":"home"},"$preview":{"width":240,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = 'display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; font-size: 13.5px; text-decoration: none; ';
    const mk = (id, label, href, count) => ({
      label, href, count: count || '',
      style: base + (id === active
        ? 'background: #F7F6F2; color: #171513; font-weight: 500; box-shadow: inset 2px 0 0 #E8461C;'
        : 'color: #3A3530; font-weight: 400;')
    });
    return {
      top: [mk('home', 'Home', 'Main.dc.html'), mk('inbox', 'Inbox', 'Inbox.dc.html', '12')],
      work: [
        mk('projects', 'Projects', 'Board.dc.html', '6'),
        mk('sprints', 'Sprints', 'Sprint.dc.html'),
        mk('applications', 'Applications', 'Applications.dc.html', '34'),
        mk('relationships', 'Relationships', 'Relationships.dc.html'),
        mk('content', 'Content calendar', 'Content.dc.html'),
        mk('newsletter', 'Newsletter', 'Newsletter.dc.html'),
        mk('drive', 'Drive', 'Drive.dc.html'),
        mk('finance', 'Budget and expenses', 'Finance.dc.html', '3')
      ],
      projects: [
        { name: 'Hackathon Kuwait', dot: 'width: 8px; height: 8px; border-radius: 50%; background: #E8461C;' },
        { name: 'The Majlis, season 1', dot: 'width: 8px; height: 8px; border-radius: 50%; background: #6B645B;' },
        { name: 'Arabic benchmark v0', dot: 'width: 8px; height: 8px; border-radius: 50%; background: #171513;' },
        { name: 'Newsletter', dot: 'width: 8px; height: 8px; border-radius: 50%; background: #7A736A;' }
      ]
    };
  }
}
</script>
</body>
</html>
