<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=Newsreader:opsz,wght@6..72,300;6..72,400&amp;display=swap">
<style>
body{margin:0;background:#F7F6F2}
a{color:#171513}a:hover{color:#E8461C}
</style>
</helmet>
<div style="position: relative; display: flex; flex-wrap: wrap; min-height: 980px; background: #F7F6F2; color: #171513; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.5;">
  <div style="flex: 1 1 220px; max-width: 240px; min-width: 0;"><dc-import name="Sidebar" active="home" hint-size="240px,980px"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px 40px;">
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #A8341A;">Thursday 30 October</span>
    <h1 style="margin: 6px 0 0; font-family: 'Newsreader', Georgia, serif; font-weight: 300; font-size: 40px;">Good morning, Ahmed</h1>
  </main>

  <div style="position: absolute; inset: 0; background: rgba(10,9,8,.45); display: flex; justify-content: center; align-items: flex-start; padding: 110px 16px 16px;">
    <div role="dialog" aria-label="Search and commands" style="width: 100%; max-width: 640px; background: #F7F6F2; border: 1px solid #E4E0D8; border-radius: 16px; box-shadow: 0 8px 30px rgba(10,9,8,.25); overflow: hidden;">
      <label style="display: flex; align-items: center; gap: 10px; padding: 16px 18px; border-bottom: 1px solid #E4E0D8;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Search</span>
        <input type="text" value="venue" style="flex: 1; font: inherit; font-size: 16px; border: 0; background: transparent; outline: none;">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B645B; border: 1px solid #E4E0D8; padding: 2px 6px;">esc</span>
      </label>
      <div style="display: flex; flex-direction: column; padding: 8px 0 10px; max-height: 600px; overflow: auto;">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: #6B645B; padding: 10px 18px 4px;">{{ g.name }}</span>
          <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="2">
            <a href="{{ i.href }}" style="{{ i.style }}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6B645B; min-width: 64px;">{{ i.tag }}</span><span style="flex: 1;">{{ i.label }}</span><span style="font-size: 12px; color: #6B645B;">{{ i.meta }}</span></a>
          </sc-for>
        </sc-for>
      </div>
      <div style="display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid #E4E0D8; font-size: 12px; color: #6B645B; flex-wrap: wrap;">
        <span><span style="font-family: 'IBM Plex Mono', monospace;">↑↓</span> move</span>
        <span><span style="font-family: 'IBM Plex Mono', monospace;">↵</span> open</span>
        <span><span style="font-family: 'IBM Plex Mono', monospace;">⌘↵</span> open in panel</span>
        <span style="margin-inline-start: auto;">Searches tickets, people, partners, mail and SharePoint</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const st = (on) => 'display: flex; align-items: center; gap: 12px; padding: 9px 18px; text-decoration: none; color: #171513; font-size: 14px; ' + (on ? 'background: #EFECE6; box-shadow: inset 2px 0 0 #171513;' : '');
    const it = (tag, label, meta, href, on) => ({ tag, label, meta, href, style: st(on) });
    return {
      groups: [
        { name: 'Tickets', items: [it('SUH-142', 'Confirm venue for Hackathon Kuwait', 'In progress · you', 'Board.dc.html', true), it('SUH-178', 'Photographer for the hackathon', 'Backlog', 'Sprint.dc.html')] },
        { name: 'Relationships', items: [it('Venue', '[Venue], main hall', 'Confirmed · Ahmed', 'Relationships.dc.html')] },
        { name: 'Mail', items: [it('partners@', 'Hall availability 14 to 15 November', 'Mon', 'Inbox.dc.html')] },
        { name: 'Files', items: [it('SharePoint', 'Venue options.xlsx', 'Hackathon Kuwait', 'Board.dc.html')] },
        { name: 'Actions', items: [it('New', 'Create ticket "venue…"', 'C', 'Board.dc.html'), it('Drive', 'Open the Events folder', '', 'Drive.dc.html'), it('Go', 'Plan next sprint', 'G then S', 'Sprint.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
