name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run ds-check
      - name: Local Supabase (Postgres, Auth, PostgREST) for dashboard and RLS tests
        run: |
          sudo apt-get install -y -q postgresql-16 >/dev/null 2>&1 || true
          sudo LOCALSB_DIR=/opt/localsb scripts/local-supabase.sh
          sudo chown $USER .env.test.local && cp .env.test.local .env.local
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env: { CI: "1", E2E: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }

  migrate:
    # Applies new migrations to staging on every push to main, then production. Skips until the secret exists.
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: staging
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/db-push.mjs pmzjqczxidunkkdgdsfj
      - name: production
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: node scripts/db-push.mjs sakcroiygqvshzaypxep
